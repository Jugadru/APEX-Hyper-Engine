name: Hyper Game FAST
on:
  push:
    branches: ['migration/alpha2-full-baseline', 'hyper/**', main]
  pull_request:
    branches: [main, 'migration/alpha2-full-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Isolate test user data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hyper-game-data"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/hyper-game-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate and baseline archive inventory
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 tools/verify_evolution_inventory.py
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import actual Godot game
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          timeout 300s godot --headless --path game --rendering-method gl_compatibility --editor --import > /tmp/hyper-import.log 2>&1 || { tail -150 /tmp/hyper-import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper-import.log; then exit 1; fi
          tail -15 /tmp/hyper-import.log
      - name: Parse all Hyper test entry points
        shell: bash
        run: |
          set -euo pipefail
          for file in game/tests/hyper2/*.gd; do
            godot --headless --path game --rendering-method gl_compatibility --check-only --script "res://${file#game/}" > /tmp/hyper-parse.log 2>&1 || { cat /tmp/hyper-parse.log; exit 1; }
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper-parse.log; then exit 1; fi
          done
      - name: Run game directional regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          for item in test_evolution test_calendar test_replay_quality test_manual_wet test_workshop test_menu test_ui test_hyper22 test_hyper23 test_hyper30 test_energy301 test_geometry302 test_wet303 test_tyres304 test_racecraft305 test_control306 test_strategy3061 test_sector3062 test_stewards3063; do
            echo "HYPER_FIXTURE $item"
            timeout 240s godot --headless --path game --rendering-method gl_compatibility --script "res://tests/hyper2/$item.gd" > "/tmp/$item.log" 2>&1 || { cat "/tmp/$item.log"; exit 1; }
            cat "/tmp/$item.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:|^FAIL ' "/tmp/$item.log"; then exit 1; fi
          done
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper22 > /tmp/hyper22-wet.log 2>&1 || { cat /tmp/hyper22-wet.log; exit 1; }
          cat /tmp/hyper22-wet.log
          grep -q '"status":"PASS"' /tmp/hyper22-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper22-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper23 > /tmp/hyper23-wet.log 2>&1 || { cat /tmp/hyper23-wet.log; exit 1; }
          cat /tmp/hyper23-wet.log
          grep -q '"status":"PASS"' /tmp/hyper23-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper23-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper30 > /tmp/hyper30-wet.log 2>&1 || { cat /tmp/hyper30-wet.log; exit 1; }
          cat /tmp/hyper30-wet.log
          grep -q '"status":"PASS"' /tmp/hyper30-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper30-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper301 > /tmp/hyper301-wet.log 2>&1 || { cat /tmp/hyper301-wet.log; exit 1; }
          cat /tmp/hyper301-wet.log
          grep -q '"status":"PASS"' /tmp/hyper301-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper301-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper302 > /tmp/hyper302-wet.log 2>&1 || { cat /tmp/hyper302-wet.log; exit 1; }
          cat /tmp/hyper302-wet.log
          grep -q '"status":"PASS"' /tmp/hyper302-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper302-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper303 > /tmp/hyper303-wet.log 2>&1 || { cat /tmp/hyper303-wet.log; exit 1; }
          cat /tmp/hyper303-wet.log
          grep -q '"status":"PASS"' /tmp/hyper303-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper303-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper304 > /tmp/hyper304-wet.log 2>&1 || { cat /tmp/hyper304-wet.log; exit 1; }
          cat /tmp/hyper304-wet.log
          grep -q '"status":"PASS"' /tmp/hyper304-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper304-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper305 > /tmp/hyper305-wet.log 2>&1 || { cat /tmp/hyper305-wet.log; exit 1; }
          cat /tmp/hyper305-wet.log
          grep -q '"status":"PASS"' /tmp/hyper305-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper305-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper306 > /tmp/hyper306-wet.log 2>&1 || { cat /tmp/hyper306-wet.log; exit 1; }
          cat /tmp/hyper306-wet.log
          grep -q '"status":"PASS"' /tmp/hyper306-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper306-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper3061 > /tmp/hyper3061-wet.log 2>&1 || { cat /tmp/hyper3061-wet.log; exit 1; }
          cat /tmp/hyper3061-wet.log
          grep -q '"status":"PASS"' /tmp/hyper3061-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper3061-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper3062 > /tmp/hyper3062-wet.log 2>&1 || { cat /tmp/hyper3062-wet.log; exit 1; }
          cat /tmp/hyper3062-wet.log
          grep -q '"status":"PASS"' /tmp/hyper3062-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper3062-wet.log; then exit 1; fi
          timeout 240s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/test_manual_wet.gd -- hyper3063 > /tmp/hyper3063-wet.log 2>&1 || { cat /tmp/hyper3063-wet.log; exit 1; }
          cat /tmp/hyper3063-wet.log
          grep -q '"status":"PASS"' /tmp/hyper3063-wet.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper3063-wet.log; then exit 1; fi
          echo HYPER_GAME_FAST_PASS
