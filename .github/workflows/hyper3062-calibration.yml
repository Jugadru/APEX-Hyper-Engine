name: Hyper 3.0.6.2 sector control calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/hyper3062-calibration.yml'
      - 'docs/HYPER3062_SECTOR.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: ITA
            weather: Seco
          - track: GBR
            weather: Variável
          - track: GBR
            weather: Chuva intensa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Isolate test user data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hyper-calibration-data"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/hyper-calibration-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and test contracts
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 tools/verify_evolution_inventory.py
          python3 -m unittest discover -s tools/tests -p test_compare_hyper_gp.py -v
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path game --rendering-method gl_compatibility --editor --import > /tmp/import.log 2>&1 || { tail -150 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Paired complete GP runs
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
          WEATHER: ${{ matrix.weather }}
        run: |
          set -euo pipefail
          for mode in hyper3061 hyper3062; do
            echo "MODE=$mode TRACK=$TRACK WEATHER=$WEATHER SEED=2026"
            timeout 360s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/full_race.gd -- "$TRACK" "$WEATHER" "$mode" 2>&1 | tee "/tmp/$mode.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "/tmp/$mode.log"; then exit 1; fi
          done
          python3 tools/compare_hyper_gp.py /tmp/hyper3061.log /tmp/hyper3062.log "$TRACK" "$WEATHER"
          PYTHONPATH=tools python3 - <<'PY'
          import os
          from compare_hyper_gp import load
          expected = {
              ("ITA", "Seco"): "60cfd20083dc23f50d1f746eb5dcfcdfcf308c8a06a7fe92198df4647a57bb65",
              ("GBR", "Chuva intensa"): "08e32152901b92524847ed42fe40235c634cd9ae663e04f521cc9655f075032d",
              ("GBR", "Variável"): "63b88dcea19d16ccbc347e2f1e38b49160f5e8e52be0eb0b6986f5d60b84b482",
          }
          key = (os.environ["TRACK"], os.environ["WEATHER"])
          assert load("/tmp/hyper3061.log")["hash"] == expected[key], "rev12 nominal sporting hash changed"
          candidate=load("/tmp/hyper3062.log")
          legacy=load("/tmp/hyper3061.log")
          for field in ("ticks","complete","retired","stops","passes","attempts","winner"):
              assert candidate[field]==legacy[field], f"observer changed sporting result: {field}"
          print("HYPER3062_LEGACY_HASH_PASS")
          PY
