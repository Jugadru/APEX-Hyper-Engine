name: Hyper FAST - isolated lab
on:
  push:
    branches: [main, 'migration/**', 'hyper/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate identity
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Migration tool synthetic tests
        run: python3 -m unittest discover -s tools/tests -v
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Run longitudinal laboratory
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          timeout 90s godot --headless --path lab/longitudinal --script res://tests/hyper22_longitudinal_adapter_test.gd 2>&1 | tee /tmp/hyper-fast.log
          grep -q 'HYPER22_LONGITUDINAL_PASS checks=' /tmp/hyper-fast.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/hyper-fast.log; then exit 1; fi
