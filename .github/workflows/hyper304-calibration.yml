name: Hyper 3.0.4 axle and tyre calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/hyper304-calibration.yml'
      - 'docs/HYPER304_TYRES.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: ITA
            weather: Seco
          - track: GBR
            weather: Variável
          - track: GBR
            weather: Chuva intensa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Isolate test user data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hyper-calibration-data"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/hyper-calibration-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and test contracts
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 tools/verify_evolution_inventory.py
          python3 -m unittest discover -s tools/tests -p test_compare_hyper_gp.py -v
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path game --rendering-method gl_compatibility --editor --import > /tmp/import.log 2>&1 || { tail -150 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Paired complete GP runs
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
          WEATHER: ${{ matrix.weather }}
        run: |
          set -euo pipefail
          for mode in hyper303 hyper304; do
            echo "MODE=$mode TRACK=$TRACK WEATHER=$WEATHER SEED=2026"
            timeout 360s godot --headless --path game --rendering-method gl_compatibility --script res://tests/hyper2/full_race.gd -- "$TRACK" "$WEATHER" "$mode" 2>&1 | tee "/tmp/$mode.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "/tmp/$mode.log"; then exit 1; fi
          done
          python3 tools/compare_hyper_gp.py /tmp/hyper303.log /tmp/hyper304.log "$TRACK" "$WEATHER"
          PYTHONPATH=tools python3 - <<'PY'
          import os
          from compare_hyper_gp import load
          expected = {
              ("ITA", "Seco"): "229060f661c8aafc990c2bd8acf6eba115d4e9623af9be4fcb5d28cb7cd12739",
              ("GBR", "Chuva intensa"): "69e3961571e9f4c4c8490197c2b505125444f7db6ecbaa4a8ce7beb8028c720d",
              ("GBR", "Variável"): "5dae3db41f968f7c614bf59201c4c3e4cdc5f4c7c05c209f1e841bda484c7281",
          }
          assert load("/tmp/hyper303.log")["hash"] == expected[(os.environ["TRACK"], os.environ["WEATHER"])], "approved rev8 sporting hash changed"
          print("HYPER304_LEGACY_HASH_PASS")
          PY
